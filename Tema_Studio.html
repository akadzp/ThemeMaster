body {
    font-family: var(--t1-font-family-primary), 'Plus Jakarta Sans', sans-serif;
    background: var(--c1-app-background);
    color: var(--c8-text-primary);
    margin: 0;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: background var(--m3-duration-medium) var(--m5-easing-standard), color var(--m3-duration-medium) var(--m5-easing-standard), font-family var(--m3-duration-medium) var(--m5-easing-standard);
}


.preview-workspace {
    flex: 1; overflow-y: auto; padding: 0;
    padding-bottom: calc(var(--panel-height) + 80px);
    background: var(--c1-app-background);
    position: relative;
    scrollbar-width: none;
    transition: var(--m3-duration-medium) var(--m5-easing-standard);
}

.view-section { display: none; }
.view-section.active { display: block; animation: fade var(--m3-duration-medium) var(--m5-easing-standard); }
@keyframes fade { from{opacity:0}to{opacity:1} }


/* =========================================
   NAVIGASI (TOP BAR)
   ========================================= */
.top-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    position: relative;
    z-index: 999;
}

.nav-brand {
    font-size: var(--t6-font-size-md);
    font-weight: 800;
    color: var(--c8-text-primary);
}

.nav-btn {
    background: var(--c3-surface-primary);
    padding: 8px 16px;
    border-radius: var(--l10-radius-full);
    font-size: 10px;
    font-weight: 800;
    color: var(--c8-text-primary);
    box-shadow: var(--l12-elevation-1);
    border: var(--l39-border-width) solid var(--c31-border-primary);
    backdrop-filter: blur(var(--l40-glass-blur));
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
}


.nav-dropdown {
    position: absolute;
    top: 50px;
    right: 15px;
    width: 140px;
    background: var(--c3-surface-primary);
    border-radius: var(--l8-radius-md);
    box-shadow: var(--l14-elevation-3);
    border: var(--l39-border-width) solid var(--c31-border-primary);
    backdrop-filter: blur(var(--l40-glass-blur));
    display: none;
    flex-direction: column;
    overflow: hidden;
}


.nav-dropdown.show {
    display: flex;
}

.nav-item {
    padding: 12px;
    font-size: 11px;
    font-weight: 700;
    border-bottom: 1px solid var(--c34-divider);
    cursor: pointer;
    color: var(--c8-text-primary);
}


/* =========================================
   EDITOR PANEL (Full Features)
   ========================================= */
.editor-panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: var(--panel-height);
    background: var(--c3-surface-primary);
    border-radius: var(--l9-radius-lg) var(--l9-radius-lg) 0 0;
    box-shadow: var(--sem-surface-overlay);
    z-index: 900;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-top: 1px solid var(--c31-border-primary);
    transition: all var(--m3-duration-medium) var(--m5-easing-standard) ease;
}

#editor-root {
    flex: 1;
    min-height: 0;
}

.btn-group {
    position: absolute;
    top: -25px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    z-index: 950;
    pointer-events: none;
}

.btn-action {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--cmp-button-elevation);
    pointer-events: auto;
}

.btn-reset {
    background: var(--c3-surface-primary);
    color: var(--c43-status-error-text);
    border: 2px solid var(--c3-surface-primary);
}

.btn-save {
    background: var(--c17-action-primary-bg);
    color: var(--c18-action-primary-text);
    border: 2px solid var(--c17-action-primary-bg);
}

.panel-tabs {
    display: flex;
    border-top: 1px solid var(--c34-divider);
    background: var(--c3-surface-primary);
    padding-bottom: env(safe-area-inset-bottom);
    flex-shrink: 0;
}

.tab-item {
    flex: 1;
    text-align: center;
    padding: 12px;
    font-size: var(--t5-font-size-sm);
    font-weight: 800;
    color: var(--c11-text-disabled);
    cursor: pointer;
    position: relative;
    font-family: var(--t1-font-family-primary);
}

.tab-item.active {
    color: var(--c8-text-primary);
}

.tab-item.active::after {
    content: '';
    position: absolute;
    top: 0;
    left: 20%;
    right: 20%;
    height: 3px;
    background: var(--c48-accent-primary);
    border-radius: 0 0 var(--l7-radius-sm) var(--l7-radius-sm);
}

.tab-content {
    display: none;
    height: 100%;
    flex-direction: column;
}

.tab-content.active {
    display: flex;
    animation: fadeIn var(--m3-duration-medium) var(--m5-easing-standard);
}

/* 1. Kunci Workspace agar tidak bocor vertikal */
.hierarchy-workspace {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 10px 15px;
    gap: 8px;
    overflow: hidden;
}

.l2-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
    flex-shrink: 0;
}

.l2-pill {
    padding: 6px 14px;
    background: var(--c4-surface-secondary);
    border-radius: var(--l10-radius-full);
    font-size: var(--t4-font-size-xs);
    font-weight: 800;
    color: var(--c9-text-secondary);
    border: 1px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: var(--sem-surface-raised);
}

.l2-pill.active {
    background: var(--c17-action-primary-bg);
    color: var(--c18-action-primary-text);
    box-shadow: var(--cmp-button-elevation);
}

.l3-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    scrollbar-width: none;
    flex-shrink: 0;
    height: 25px;
    align-items: center;
    border-bottom: 1px dashed var(--c34-divider);
}

.l3-text {
    font-size: 10px;
    font-weight: 700;
    color: var(--c10-text-tertiary);
    cursor: pointer;
    white-space: nowrap;
}

.l3-text.active {
    color: var(--c48-accent-primary);
    font-weight: 800;
}

.l4-scroll {
    flex: 1;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 5px;
}

.l4-card {
    min-width: 90px;
    height: 90%;
    background: var(--c3-surface-primary);
    border: 1px solid var(--c31-border-primary);
    border-radius: var(--l8-radius-md);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.2s;
    gap: 4px;
    box-shadow: var(--sem-surface-raised);
}

.l4-card i {
    font-size: 18px;
    color: var(--c10-text-tertiary);
}

.l4-card span {
    font-size: 9px;
    font-weight: 700;
    color: var(--c9-text-secondary);
    text-align: center;
}

.l4-card.active {
    border-color: var(--c48-accent-primary);
    background: var(--c50-accent-subtle);
    box-shadow: inset 0 0 0 1px var(--c48-accent-primary);
}

.l4-card.active i {
    color: var(--c48-accent-primary);
}

.l4-card.active span {
    color: var(--c48-accent-primary);
}

.floating-toolbar {
    position: fixed;
    bottom: calc(var(--panel-height) + 15px);
    left: 15px;
    right: 15px;
    height: 50px;
    background: var(--c7-surface-overlay);
    backdrop-filter: var(--c72-backdrop-filter-tint);
    border: 1px solid var(--c32-border-secondary);
    border-radius: var(--l10-radius-full);
    display: flex;
    align-items: center;
    padding: 0 6px;
    z-index: 920;
    box-shadow: var(--sem-surface-overlay);
    transition: bottom var(--m3-duration-medium) var(--m5-easing-standard);
}


.ft-btn {
    width: 38px;
    height: 38px;
    border-radius: var(--l10-radius-full);
    border: none;
    background: var(--c6-surface-elevated);
    color: var(--c9-text-secondary);
    cursor: pointer;
    margin-right: 5px;
    transition: var(--m3-duration-medium) var(--m5-easing-standard);
    box-shadow: var(--sem-surface-raised);
}

.ft-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
}

.ft-divider {
    width: 1px;
    height: 20px;
    background: var(--c34-divider);
    margin: 0 8px;
}

.ft-scroll {
    flex: 1;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    align-items: center;
    scrollbar-width: none;
}

.ft-color-item {
    width: 32px;
    height: 32px;
    border-radius: var(--l10-radius-full);
    border: 2px solid var(--c6-surface-elevated);
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
}

/* Customizer Opts */
#customizer-box {
    display: flex;
    gap: 8px;
    padding: 10px 15px;
    border-top: 1px dashed var(--c34-divider);
    margin-top: 5px;
    overflow-x: auto;
    scrollbar-width: none;
    flex-shrink: 0;
    min-height: 40px;
    align-items: center;
}

.opt-grid {
    display: flex;
    flex-direction: row !important;
    gap: 6px;
    width: 100%;
    height: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 2px 2px 8px 2px;
    align-items: stretch;
    scrollbar-width: none;
}

.opt-grid::-webkit-scrollbar {
    display: none;
}

.opt-row {
    flex: 0 0 auto;
    width: 95px;
    margin: 0;
    background: var(--c4-surface-secondary);
    border: 1px solid var(--c32-border-primary);
    border-radius: var(--l8-radius-md);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 6px;
    position: relative;
    box-shadow: var(--sem-surface-raised);
    transition: transform 0.2s, border-color 0.2s;
}

.opt-row:active {
    transform: scale(0.96);
}

.opt-row.active {
    border-color: var(--c48-accent-primary);
    background: var(--c50-accent-subtle);
}

.opt-row > div:first-child {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
    width: 100%;
    position: relative;
}

.opt-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 100%;
}

.opt-info i {
    font-size: 10px;
    color: var(--c10-text-tertiary);
    background: var(--c4-surface-secondary);
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 5px;
}

.opt-row.active .opt-info i {
    background: var(--c48-accent-primary);
    color: var(--c18-action-primary-text);
}

.opt-info span {
    font-size: 8px;
    font-weight: 700;
    color: var(--c8-text-primary);
    line-height: 1.1;
    max-width: 75%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.toggle-switch {
    position: absolute;
    top: 0;
    right: 0;
    transform: scale(0.45);
    transform-origin: top right;
}

#layout-opt-grid .opt-row {
    width: 135px;
    padding: 6px;
    justify-content: space-between;
}

#layout-opt-grid .opt-row > div:last-child {
    margin-top: 5px;
    padding-top: 5px;
    border-top: 1px solid var(--c34-divider);
    width: 100%;
    display: flex;
    gap: 2px;
}

#layout-opt-grid button {
    flex: 1;
    border: 1px solid var(--c31-border-primary);
    background: var(--c3-surface-primary);
    color: var(--c9-text-secondary);
    font-size: 7px;
    font-weight: 700;
    padding: 3px 0;
    border-radius: 3px;
    cursor: pointer;
    transition: 0.2s;
}

#layout-opt-grid button[style*="var(--accent)"] {
    border-color: var(--c48-accent-primary) !important;
    background: var(--c48-accent-primary) !important;
    color: var(--c18-action-primary-text) !important;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}

.toggle-switch::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    background: #ffffff;
    border-radius: 50%;
    transition: var(--m3-duration-medium) var(--m5-easing-standard) cubic-bezier(0.4, 0.0, 0.2, 1);
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
}

.opt-row.active {
    border-color: var(--c48-accent-primary);
    background: var(--c50-accent-subtle);
}

.opt-row.active .opt-info i,
.opt-row.active .opt-info span {
    color: var(--c48-accent-primary);
}

.opt-row.active .toggle-switch {
    background: var(--c48-accent-primary);
}

.opt-row.active .toggle-switch::after {
    left: 18px;
}

<script id="ui-sdk-engine">
const ColorUtils = {
    _cache: new Map(), 

    hexToRgb: (hex) => {
        if (!hex || typeof hex !== 'string') return { r: 0, g: 0, b: 0 };
        let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 0, g: 0, b: 0 };
    },

    rgbToHex: (r, g, b) => {
        const clamp = (v) => Math.max(0, Math.min(255, Math.round(v)));
        return "#" + ((1 << 24) + (clamp(r) << 16) + (clamp(g) << 8) + clamp(b)).toString(16).slice(1);
    },

    hexToOklch: (hex) => {
        if (ColorUtils._cache.has(hex)) return ColorUtils._cache.get(hex);

        let { r, g, b } = ColorUtils.hexToRgb(hex);
        const toLinear = (c) => {
            let v = c / 255;
            return v >= 0.04045 ? Math.pow((v + 0.055) / 1.055, 2.4) : v / 12.92;
        };
        let lr = toLinear(r), lg = toLinear(g), lb = toLinear(b);
        
        let l = 0.4122214708 * lr + 0.5363325363 * lg + 0.0514459929 * lb;
        let m = 0.2119034982 * lr + 0.6806995451 * lg + 0.1073969566 * lb;
        let s = 0.0883024619 * lr + 0.2817188376 * lg + 0.6299787005 * lb;

        let l_ = Math.cbrt(l), m_ = Math.cbrt(m), s_ = Math.cbrt(s);

        let L = 0.2104542553 * l_ + 0.7936177850 * m_ - 0.0040720468 * s_;
        let a = 1.9779984951 * l_ - 2.4285922050 * m_ + 0.4505937099 * s_;
        let B = 0.0259040371 * l_ + 0.7827717662 * m_ - 0.8086757660 * s_;

        let C = Math.sqrt(a * a + B * B);
        let h = Math.atan2(B, a) * (180 / Math.PI);
        if (h < 0) h += 360;

        const result = { l: L, c: C, h: h };
        

        if (ColorUtils._cache.size > 200) ColorUtils._cache.clear();
        ColorUtils._cache.set(hex, result);
        
        return result;
    },

    oklchToHex: (L, C, h) => {
        const cacheKey = `oklch_${L.toFixed(3)}_${C.toFixed(3)}_${h.toFixed(1)}`;
        if (ColorUtils._cache.has(cacheKey)) return ColorUtils._cache.get(cacheKey);

        let hr = h * (Math.PI / 180);

        // Helper untuk iterasi RGB
        const getRGB = (cL, cC) => {
            let a = cC * Math.cos(hr), B = cC * Math.sin(hr);
            let l_ = cL + 0.3963377774 * a + 0.2158037573 * B;
            let m_ = cL - 0.1055613458 * a - 0.0638541728 * B;
            let s_ = cL - 0.0894841775 * a - 1.2914855480 * B;
            let l = l_*l_*l_, m = m_*m_*m_, s = s_*s_*s_;
            let lr = +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
            let lg = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
            let lb = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
            const fromLinear = (c) => c >= 0.0031308 ? 1.055 * Math.pow(c, 1 / 2.4) - 0.055 : 12.92 * c;
            return [fromLinear(lr) * 255, fromLinear(lg) * 255, fromLinear(lb) * 255];
        };

        let [r, g, b] = getRGB(L, C);

        // GAMUT MAPPING: Jika warna "pecah" (out of sRGB gamut)
        if (r < 0 || r > 255 || g < 0 || g > 255 || b < 0 || b > 255) {
            let step = C / 2;
            let currentC = C - step;
            // Binary search 4 langkah (Super ringan, akurasi tinggi untuk UI)
            for(let i = 0; i < 4; i++) {
                step /= 2;
                [r, g, b] = getRGB(L, currentC);
                if (r < 0 || r > 255 || g < 0 || g > 255 || b < 0 || b > 255) {
                    currentC -= step; // Masih pecah, turunin Chroma
                } else {
                    currentC += step; // Udah aman, coba naikin Chroma dikit
                }
            }
            [r, g, b] = getRGB(L, currentC - step); // Safe fallback final
        }

        const hexResult = ColorUtils.rgbToHex(r, g, b);
        ColorUtils._cache.set(cacheKey, hexResult);
        return hexResult;
    },

    hexToRgba: (hex, alpha) => {
        const { r, g, b } = ColorUtils.hexToRgb(hex);
        return { type: 'color', r, g, b, alpha };
    },

    getLuminance: (hex) => ColorUtils.hexToOklch(hex).l,
    
    getReadableText: (bgHex, colorValues) => {
        return ColorUtils.getLuminance(bgHex) > 0.65 ? (colorValues?.textColorDark || '#000000') : (colorValues?.textColorLight || '#ffffff');
    },

    mix: (c1, c2, weight) => {
        const rgb1 = ColorUtils.hexToRgb(c1), rgb2 = ColorUtils.hexToRgb(c2);
        return ColorUtils.rgbToHex(
            Math.round(rgb1.r * weight + rgb2.r * (1 - weight)),
            Math.round(rgb1.g * weight + rgb2.g * (1 - weight)),
            Math.round(rgb1.b * weight + rgb2.b * (1 - weight))
        );
    }
};


class ColorEngine {
    async process(state, config) {
        const variant = config.VARIANTS ? config.VARIANTS[state.activeStyleId] : null;
        if (!variant) return { palette: {}, tokens: {} };

        const colorDna = variant.color_dna || {};
        const fam = config.FAMILIES ? config.FAMILIES[variant.fam] : null;
        const worldColorKey = variant.worldColor || (fam ? fam.worldColor : 'wc_a');
        const worldColorStrategy = config.worldColor ? config.worldColor[worldColorKey] : null;
        
        if (!worldColorStrategy) return { palette: {}, tokens: {} };
        const colorValues = fam ? fam.colorValues : {}; 
        const baseColor = state.currentColor || '#3b82f6';

        let isDark = state.isDark;
        if (worldColorStrategy.dark_policy === 'wajib-on') isDark = true;
        if (worldColorStrategy.dark_policy === 'wajib-off') isDark = false;

        let isBgFilled = state.isBgFilled;
        if (worldColorStrategy.bg_policy === 'wajib-on') isBgFilled = true;
        if (worldColorStrategy.bg_policy === 'wajib-off') isBgFilled = false;

        const palette = this._generatePalette(baseColor, colorDna, isDark, isBgFilled, colorValues);
        const tokens = this._routeToTokens(palette, worldColorStrategy);
        
        return { palette, tokens };
    }

            _generatePalette(baseColor, colorDna, isDark, isBgFilled, colorValues, configDefaults) {
        let oklch = ColorUtils.hexToOklch(baseColor);
        const def = configDefaults || {};

        oklch.h = (oklch.h + (colorDna.hue_rotation ?? def.hue_rotation ?? 0)) % 360;

        let cBoost = (colorDna.saturation_boost ?? def.saturation_boost ?? 0); 
        oklch.c = Math.max(0, oklch.c + cBoost);
        
        const tint = isBgFilled ? (colorDna.bg_tint_strength ?? def.bg_tint_strength ?? 0.1) : 0;


        let confDark = (colorValues.baseDark ?? def.baseDark ?? 15) / 100;
        let confLight = (colorValues.baseLight ?? def.baseLight ?? 96) / 100;
        let surfOffset = (colorValues.surfLOffset ?? def.surfLOffset ?? 3) / 100;
        
        let bgL = isDark ? confDark : confLight;
        bgL = isDark ? bgL + ((oklch.l - bgL) * tint) : bgL - ((bgL - oklch.l) * tint);
        
        const maxL = (colorValues.maxLightness ?? def.maxLightness ?? 99) / 100;
        const minL = (colorValues.minLightness ?? def.minLightness ?? 1) / 100;
        bgL = Math.max(minL, Math.min(maxL, bgL));

        const surfL = isDark ? bgL + surfOffset : bgL;

        const contrastThreshold = colorDna.contrast_threshold ?? def.contrast_threshold ?? 0.65;
        const isBgDark = bgL < contrastThreshold;


        let priL = (colorDna.primary_lightness ?? def.primary_lightness) !== undefined 
            ? (colorDna.primary_lightness ?? def.primary_lightness) / 100 
            : oklch.l;
            
        let secL = (colorDna.secondary_lightness ?? def.secondary_lightness) !== undefined 
            ? (colorDna.secondary_lightness ?? def.secondary_lightness) / 100 
            : oklch.l;

        const harmonyType = colorDna.harmony_type ?? def.harmony_type ?? 'monochromatic';
        const harmonyStrength = colorDna.harmony_strength ?? def.harmony_strength ?? 1.0;
        
        let secHue = oklch.h;
        let terHue = oklch.h;
        
        if (harmonyType === 'complementary') {
            secHue = (oklch.h + 180) % 360;
            terHue = (oklch.h + 180) % 360;
        } else if (harmonyType === 'analogous') {
            secHue = (oklch.h + 30) % 360;
            terHue = (oklch.h - 30 + 360) % 360;
        } else if (harmonyType === 'triadic') {
            secHue = (oklch.h + 120) % 360;
            terHue = (oklch.h + 240) % 360;
        } else if (harmonyType === 'split_complementary') {
            secHue = (oklch.h + 150) % 360;
            terHue = (oklch.h + 210) % 360;
        } else {
            secHue = (oklch.h + (colorDna.secondary_hue_rotation ?? def.secondary_hue_rotation ?? 0)) % 360;
            terHue = secHue;
        }

        const secChroma = oklch.c * harmonyStrength;

        const palette = {
            background: ColorUtils.oklchToHex(bgL, isBgFilled ? (oklch.c * tint) : 0, oklch.h),
            surface: ColorUtils.oklchToHex(surfL, isBgFilled ? (oklch.c * tint) : 0, oklch.h),
            primary: ColorUtils.oklchToHex(priL, oklch.c, oklch.h),
            secondary: ColorUtils.oklchToHex(secL, secChroma, secHue),
            tertiary: ColorUtils.oklchToHex(secL, secChroma, terHue),
                        textPrimary: isBgDark ? (colorValues.textColorDark ?? def.textColorDark ?? '#ffffff') : (colorValues.textColorLight ?? def.textColorLight ?? '#000000'),
            textSecondary: isBgDark ? (colorValues.textSecondaryDark ?? def.textSecondaryDark ?? '#9ca3af') : (colorValues.textSecondaryLight ?? def.textSecondaryLight ?? '#4b5563'),
            textOnCore: ColorUtils.getReadableText(ColorUtils.oklchToHex(priL, oklch.c, oklch.h), colorValues)
        };

        const shadeCount = colorValues.shadeCount ?? def.shade_count ?? 5;
        const spread = maxL - minL;
        const step = spread / (shadeCount > 1 ? shadeCount - 1 : 1);
        for (let i = 0; i < shadeCount; i++) {
            palette[`shade_${i}`] = ColorUtils.oklchToHex(minL + (i * step), oklch.c, oklch.h);
        }

        palette.alpha = {
            subtle: colorDna.subtle_opacity ?? def.subtle_opacity ?? 0.1,
            glass: colorDna.glass_opacity ?? def.glass_opacity ?? 0.6,
            border: isBgDark ? (colorDna.border_opacity_dark ?? def.border_opacity ?? 0.15) : (colorDna.border_opacity_light ?? def.border_opacity ?? 0.1),
            shadow: isDark ? (colorDna.shadow_opacity_dark ?? def.shadow_opacity_dark ?? 0.5) : (colorDna.shadow_opacity_light ?? def.shadow_opacity_light ?? 0.1),
            highlight: isDark ? (colorDna.highlight_opacity_dark ?? def.highlight_opacity_dark ?? 0.1) : (colorDna.highlight_opacity_light ?? def.highlight_opacity_light ?? 0.5)
        };

        palette.status = {
            success: colorValues.status_success ?? def.status_success ?? '#10b981',
            warning: colorValues.status_warning ?? def.status_warning ?? '#f59e0b',
            error: colorValues.status_error ?? def.status_error ?? '#ef4444',
            info: colorValues.status_info ?? def.status_info ?? '#3b82f6'
        };

        return palette;
    }


    _routeToTokens(palette, strategy) {
        const tokens = {};
        const dict = {
            background: { hex: palette.background, a: 1 },
            surface: { hex: palette.surface, a: 1 },
            surface_glass: { hex: palette.surface, a: palette.alpha.glass },
            surface_subtle: { hex: palette.textPrimary, a: palette.alpha.border },
            primary: { hex: palette.primary, a: 1 },
            secondary: { hex: palette.secondary, a: 1 },
            tertiary: { hex: palette.tertiary, a: 1 },
            primary_subtle: { hex: palette.primary, a: palette.alpha.subtle },
            textPrimary: { hex: palette.textPrimary, a: 1 },
            textSecondary: { hex: palette.textSecondary, a: 1 },
            textOnCore: { hex: palette.textOnCore, a: 1 },
            shadow: { hex: '#000000', a: palette.alpha.shadow },
            highlight: { hex: '#ffffff', a: palette.alpha.highlight },
            transparent: { hex: '#000000', a: 0 },
            glass_fx: { hex: palette.surface, a: palette.alpha.glass },
            success: { hex: palette.status.success, a: 1 },
            warning: { hex: palette.status.warning, a: 1 },
            error: { hex: palette.status.error, a: 1 },
            info: { hex: palette.status.info, a: 1 },
            utility: { hex: palette.textPrimary, a: palette.alpha.shadow }
        };

        Object.entries(strategy.mapping || {}).forEach(([dictKey, mapConfig]) => {
            let tokenArray = [];
            let strength = 1.0;
            let sourceKey = dictKey;

            if (Array.isArray(mapConfig)) {
                tokenArray = mapConfig;
            } else if (typeof mapConfig === 'object') {
                tokenArray = mapConfig.tokens || [];
                strength = mapConfig.strength ?? 1.0;
                sourceKey = mapConfig.source || dictKey;
            }

            const source = dict[sourceKey] || dict.transparent;
            
            let rVal = 0, gVal = 0, bVal = 0;
            
            if (strength < 1.0 && sourceKey !== 'transparent') {
                const baseSource = dict['background'] || dict.transparent;
                const mixedHex = ColorUtils.mix(source.hex, baseSource.hex, strength);
                const rgb = ColorUtils.hexToRgb(mixedHex);
                rVal = rgb.r; gVal = rgb.g; bVal = rgb.b;
            } else {
                const rgb = ColorUtils.hexToRgb(source.hex);
                rVal = rgb.r; gVal = rgb.g; bVal = rgb.b;
            }

            tokenArray.forEach(varName => {
                tokens[varName] = { type: 'color', r: rVal, g: gVal, b: bVal, alpha: source.a };
            });
        });

        return tokens;
    }
}




class ThemeEngine {
    async process(state, config) {
        const variant = config.VARIANTS ? config.VARIANTS[state.activeStyleId] : null;
        if (!variant) return { vars: {}, tokens: {} };

        const themeDna = variant.theme_dna || {};
        const fam = config.FAMILIES ? config.FAMILIES[variant.fam] : null;
        const worldThemeConfig = variant.worldTheme || (fam ? fam.worldTheme : null);
        
        if (!worldThemeConfig) return { vars: {}, tokens: {} };


        const instructions = [];
        if (state.activeOptions && config.OPTIONS) {
            state.activeOptions.forEach(optId => {
                const opt = config.OPTIONS[optId];
                if (opt && opt.instruction) instructions.push(opt.instruction);
            });
        }
        const isInset = instructions.includes('invert_shadow_to_inset');
        const hasMicroBorder = instructions.includes('inject_micro_border_0.5px');

        const vars = this._generateThemeVars(themeDna, worldThemeConfig, isInset);
        const tokens = this._generateTokens(themeDna, vars, isInset, hasMicroBorder);

        return { vars, tokens };
    }

        _generateThemeVars(themeDna, worldThemeConfig, isInset, configDefaults) {
        const vars = {};
        const def = configDefaults || {};
        const shadowScale = themeDna.shadow_scale ?? def.shadow_scale;
        const physics = worldThemeConfig.physics_logic || def.physics_logic;
        
        vars.rawShadow = {
            style: worldThemeConfig.shadow_style ?? def.shadow_style,
            baseElevation: (worldThemeConfig.shadow_offset_base ?? def.shadow_offset_base) * shadowScale,
            physics: physics
        };

        vars.spacing = { 
            scale: themeDna.spacing_scale ?? def.spacing_scale, 
            base: worldThemeConfig.spacing_baseline ?? def.spacing_baseline 
        };
        
        vars.radius = {
            scale: themeDna.radius_scale ?? def.radius_scale,
            base: worldThemeConfig.radius_baseline ?? def.radius_baseline,
            force_sharp: themeDna.force_sharp ?? def.force_sharp,
            force_round: themeDna.force_round ?? def.force_round
        };

        vars.border = {
            width: (worldThemeConfig.border_width_base ?? def.border_width_base) * (themeDna.border_width_scale ?? def.border_width_scale),
            style: worldThemeConfig.border_style ?? def.border_style
        };

        vars.surface = {
            style: worldThemeConfig.surface_style ?? def.surface_style,
            glassBlur: (worldThemeConfig.surface_glass_blur ?? def.surface_glass_blur) * (themeDna.glass_blur_scale ?? def.glass_blur_scale),
            personality: worldThemeConfig.surface_personality ?? def.surface_personality ?? 'digital',
            decoration: worldThemeConfig.decoration_strategy ?? def.decoration_strategy ?? 'none',
            laws: worldThemeConfig.visual_laws ?? def.visual_laws ?? {}
        };
        
        vars.scaleRatio = worldThemeConfig.scale_ratio ?? def.scale_ratio;
        vars.elevationMults = worldThemeConfig.elevation_multipliers ?? def.elevation_multipliers;

        return vars;
    }

    _generateShadow(style, elevationZ, physicsLogic, isInset = false) {
        if (style === 'none' || !style || elevationZ === 0) return { type: 'none' };
        
        const angle = physicsLogic?.light_angle ?? 90;
        const rad = angle * (Math.PI / 180);
        let dirX = Math.cos(rad);
        let dirY = Math.sin(rad);

        if (isInset) { dirX = -dirX; dirY = -dirY; }

        const layers = [];
        
        const pUmbra = physicsLogic?.umbra ?? { blur: 1.0, spread: 0, dist: 0.5 };
        const pPenumbra = physicsLogic?.penumbra ?? { blur: 2.5, spread: -0.2, dist: 1.0 };
        const pAmbient = physicsLogic?.ambient ?? { blur: 0.5, spread: 0, dist: 0.2 };

        if (style === 'clay' || physicsLogic?.shadow_render_type === 'dual_opposing') {
            layers.push({ intent: 'base_shadow', x: Number((dirX * elevationZ).toFixed(2)), y: Number((dirY * elevationZ).toFixed(2)), blur: elevationZ * pUmbra.blur, spread: elevationZ * pUmbra.spread, inset: isInset });
            layers.push({ intent: 'highlight', x: Number((-dirX * elevationZ).toFixed(2)), y: Number((-dirY * elevationZ).toFixed(2)), blur: elevationZ * pUmbra.blur, spread: elevationZ * pUmbra.spread, inset: !isInset });
        } 
        else if (style === 'hard' || physicsLogic?.shadow_render_type === 'hard_flat') {
            layers.push({ intent: 'base_shadow', x: Number((dirX * elevationZ).toFixed(2)), y: Number((dirY * elevationZ).toFixed(2)), blur: 0, spread: 0, inset: isInset });
        }
        else {
            layers.push({ intent: 'base_shadow', x: Number((dirX * elevationZ * pUmbra.dist).toFixed(2)), y: Number((dirY * elevationZ * pUmbra.dist).toFixed(2)), blur: elevationZ * pUmbra.blur, spread: elevationZ * pUmbra.spread, inset: isInset });
            layers.push({ intent: 'base_shadow', x: Number((dirX * elevationZ * pPenumbra.dist).toFixed(2)), y: Number((dirY * elevationZ * pPenumbra.dist).toFixed(2)), blur: elevationZ * pPenumbra.blur, spread: Number((elevationZ * pPenumbra.spread).toFixed(2)), inset: isInset });
            layers.push({ intent: 'base_shadow', x: 0, y: Number((elevationZ * pAmbient.dist).toFixed(2)), blur: elevationZ * pAmbient.blur, spread: elevationZ * pAmbient.spread, inset: isInset });
        }
        
        return { type: 'shadow', layers };
    }

    _generateTokens(themeDna, vars, isInset = false, hasMicroBorder = false) {
        const tokens = {};
        const calcScale = (b, s, step) => Number(((b * s) * Math.pow(vars.scaleRatio, step)).toFixed(2));

        ['xs', 'sm', 'md', 'lg', 'xl'].forEach((size, i) => {
            const key = `space${size.charAt(0).toUpperCase() + size.slice(1)}`;
            tokens[key] = { value: calcScale(vars.spacing.base, vars.spacing.scale, i - 1), unit: 'px' };
        });

        const rVal = (step) => {
            if (vars.radius.force_sharp) return 0;
            if (vars.radius.force_round) return 9999;
            return calcScale(vars.radius.base, vars.radius.scale, step);
        };
        tokens['radiusNone'] = { value: 0, unit: 'px' };
        tokens['radiusSm'] = { value: rVal(-1), unit: 'px' };
        tokens['radiusMd'] = { value: rVal(0), unit: 'px' };
        tokens['radiusLg'] = { value: rVal(1), unit: 'px' };
        tokens['radiusFull'] = { value: 9999, unit: 'px' };

        vars.elevationMults.forEach((mult, i) => {
            const key = `elevation${i}`;
            if (i === 0 || mult === 0) {
                tokens[key] = { type: 'none' };
            } else {
                const zHeight = vars.rawShadow.baseElevation * mult;
                tokens[key] = this._generateShadow(vars.rawShadow.style, zHeight, vars.rawShadow.physics, isInset);
            }
        });

        tokens['borderWidth'] = { value: hasMicroBorder ? 0.5 : vars.border.width, unit: 'px' };
        tokens['glassBlur'] = { value: vars.surface.glassBlur, unit: 'px' };

        let surfaceFx = 'none';
        if (vars.surface.style === 'gradient') {
            surfaceFx = 'linear-gradient(145deg, var(--c60-derived-overlay-blend) 0%, var(--c51-shadow-color) 100%)';
        } else if (vars.surface.style === 'glass') {
            surfaceFx = 'linear-gradient(135deg, var(--c60-derived-overlay-blend) 0%, var(--c52-overlay-scrim) 100%)';
        }

        if (vars.surface.laws.surface_must_match_bg) {
            tokens['surfaceFx'] = { value: 'none', unit: '' };
        } else if (vars.surface.laws.color_source_is_backdrop) {
            surfaceFx = 'none';
        }

        if (vars.surface.personality === 'organic') {
            surfaceFx = surfaceFx !== 'none' ? `${surfaceFx}, radial-gradient(circle at 50% 0%, var(--c60-derived-overlay-blend) 0%, transparent 60%)` : 'radial-gradient(circle at 50% 0%, var(--c60-derived-overlay-blend) 0%, transparent 60%)';
        } else if (vars.surface.personality === 'brutalism') {
            surfaceFx = 'none';
            tokens['borderWidth'] = { value: hasMicroBorder ? 1 : Math.max(2, vars.border.width), unit: 'px' };
        }

        if (vars.surface.decoration === 'noise') {
            const noiseStr = `url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E')`;
            surfaceFx = surfaceFx !== 'none' ? `${surfaceFx}, ${noiseStr}` : noiseStr;
        } else if (vars.surface.decoration === 'stripes') {
            const stripeStr = `repeating-linear-gradient(45deg, transparent, transparent 10px, var(--c60-derived-overlay-blend) 10px, var(--c60-derived-overlay-blend) 20px)`;
            surfaceFx = surfaceFx !== 'none' ? `${surfaceFx}, ${stripeStr}` : stripeStr;
        }

        tokens['surfaceFx'] = { value: surfaceFx, unit: '' };

        return tokens;
    }
}

class IconEngine {
    constructor() { this.cache = {}; this.pending = {}; }
    async loadPackIndex(prefix) {
        const cleanPrefix = prefix.replace(/_/g, '-');
        if (this.cache[cleanPrefix]) return this.cache[cleanPrefix];
        if (this.pending[cleanPrefix]) return this.pending[cleanPrefix];
        try {
            const promise = fetch(`https://api.iconify.design/collection?prefix=${cleanPrefix}`)
                .then(res => { if (!res.ok) throw new Error(); return res.json(); })
                .then(data => {
                    const validIcons = new Set(data.uncategorized || []);
                    if (data.categories) Object.values(data.categories).forEach(l => l.forEach(n => validIcons.add(n)));
                    if (data.aliases) Object.keys(data.aliases).forEach(a => validIcons.add(a));
                    this.cache[cleanPrefix] = validIcons;
                    delete this.pending[cleanPrefix];
                    return validIcons;
                })
                .catch(() => { delete this.pending[cleanPrefix]; return new Set(); });
            this.pending[cleanPrefix] = promise;
            return promise;
        } catch (e) { return new Set(); }
    }
    async process(state, config) {
        const pack = state.activeIconPack || 'solar';
        const validSet = await this.loadPackIndex(pack);
        const iconList = Array.from(validSet);
        const findBestMatch = (keywords) => {
            if (!keywords || keywords.length === 0) return null;
            if (iconList.length === 0) return keywords[0]; 
            for (let i = 0; i < keywords.length; i++) {
                const primary = keywords[i];
                const modifiers = keywords.filter(k => k !== primary);
                const candidates = iconList.filter(name => name.includes(primary));
                if (candidates.length > 0) {
                    candidates.sort((a, b) => {
                        let scoreA = 0, scoreB = 0;
                        modifiers.forEach(mod => { if (a.includes(mod)) scoreA += 10; if (b.includes(mod)) scoreB += 10; });
                        if (a.startsWith(primary)) scoreA += 5; if (b.startsWith(primary)) scoreB += 5;
                        scoreA -= a.length * 0.5; scoreB -= b.length * 0.5;
                        return scoreB - scoreA;
                    });
                    return candidates[0];
                }
            }
            return keywords[0];
        };
        
        const resolvedIcons = {};
        if (config.FALLBACKS) {
            Object.keys(config.FALLBACKS).forEach(key => {
                resolvedIcons[key] = `${pack}:${findBestMatch(config.FALLBACKS[key])}`;
            });
        }

        return { 
            iconography: { 
                currentPack: pack, 
                scriptUrl: config.API_SCRIPT, 
                resolved: resolvedIcons 
            } 
        };
    }
}

<script id="ui-sdk-renderer">
class ColorRenderer {
    constructor() {
        // Cek dukungan mesin rendering browser terhadap Wide Gamut
        this.supportsP3 = typeof window !== 'undefined' && window.CSS && CSS.supports('color', 'color(display-p3 1 1 1)');
    }

    render(manifest, state, root, layoutConfig, tokenMap) {
        const context = manifest;
        if (!context.tokens || !tokenMap) return;
        
        Object.keys(context.tokens).forEach(k => {
            const val = context.tokens[k];
            const cssVarName = tokenMap[k];
            if (!cssVarName) return;
            
            if (val && typeof val === 'object' && val.type === 'color') {
                // 1. STANDARD OUTPUT (Fallback Universal)
                // Wajib di-set duluan agar browser lawas tetap hidup
                const srgbValue = `rgba(${val.r}, ${val.g}, ${val.b}, ${val.alpha})`;
                root.setProperty(cssVarName, srgbValue);

                // 2. PROGRESSIVE ENHANCEMENT (P3 Wide Gamut)
                // Jika browser paham P3, kita timpa variabelnya dengan format CSS Level 4
                if (this.supportsP3) {
                    // CSS color() function butuh skala 0-1, bukan 0-255
                    const rP3 = (val.r / 255).toFixed(4);
                    const gP3 = (val.g / 255).toFixed(4);
                    const bP3 = (val.b / 255).toFixed(4);
                    const p3Value = `color(display-p3 ${rP3} ${gP3} ${bP3} / ${val.alpha})`;
                    
                    try {
                        root.setProperty(cssVarName, p3Value);
                    } catch (e) {
                        // Silent fail (Toleransi Kesalahan sesuai Prinsip 3)
                        // Kalau gagal, UI tetap hidup pakai srgbValue yang udah diset di atas
                    }
                }
            }
        });
    }
}


class ThemeRenderer {
    render(manifest, state, root, layoutConfig, tokenMap) {
        const context = manifest;
        if (!context.tokens || !tokenMap) return;
        Object.keys(context.tokens).forEach(k => {
            const val = context.tokens[k];
            const cssVarName = tokenMap[k];
            if (!cssVarName) return;

            if (val && typeof val === 'object') {
                let cssVarValue = null;
                
                if (val.type === 'none') {
                    cssVarValue = 'none';
                } else if (val.type === 'shadow') {
                    cssVarValue = val.layers.map(layer => {
                        const color = layer.intent === 'highlight' 
                            ? `var(${tokenMap.derivedOverlayBlend || '--c60-derived-overlay-blend'}, rgba(255,255,255,0.2))` 
                            : `var(${tokenMap.shadowColor || '--c51-shadow-color'}, rgba(0,0,0,0.15))`;
                        const insetStr = layer.inset ? 'inset ' : '';
                        return `${insetStr}${layer.x}px ${layer.y}px ${layer.blur}px ${color}`;
                    }).join(', ');
                } else if (val.unit !== undefined) {
                    cssVarValue = `${val.value}${val.unit}`;
                }
                
                if (cssVarValue !== null) {
                    root.setProperty(cssVarName, cssVarValue);
                }
            }
        });
    }
}

class FontRenderer {
    render(manifest, state, root, layoutConfig, tokenMap) {

        if (!context.tokens || !tokenMap) return;

                root.setProperty(cssVarName, `'${val.value}', ${val.fallback}`);
            }

}

class LayoutRenderer {
    constructor() { this.styleId = 'ui-sdk-layout-style'; }
    
    render(manifest, state, root, layoutConfig) {
        const layoutData = manifest.layout;
        const pageLayoutConfig = layoutConfig;
        if (!layoutData || !pageLayoutConfig) return;
        
        let styleTag = document.getElementById(this.styleId) || document.createElement('style');
        styleTag.id = this.styleId;
        if (!styleTag.parentNode) document.head.appendChild(styleTag);

        let finalCss = "";

        pageLayoutConfig.forEach(section => {
            let activeStructure = [];
            const activeVariantId = layoutData[section.target];

            section.groups.forEach(group => {
                const match = group.variant.find(v => v.id === activeVariantId);
                if (match) {
                    finalCss += match.style || "";
                    activeStructure = match.structure || [];
                }
            });

            this._renderZone(section.target, activeStructure);
        });

        styleTag.innerHTML = finalCss;
    }

    _renderZone(containerId, structureArray) {
        const container = document.getElementById(containerId);
        if (!container) return;
        
        while (container.firstChild) {
            container.removeChild(container.firstChild);
        }
        container.className = `${containerId} ctx-override`;
        
        if (Array.isArray(structureArray)) {
            const fragment = document.createDocumentFragment();
            const templateCache = document.createElement('template');

            structureArray.forEach(zoneConfig => {
                const zoneDiv = document.createElement('div');
                zoneDiv.className = zoneConfig.id;
                
                if (zoneConfig.content && Array.isArray(zoneConfig.content)) {
                    zoneConfig.content.forEach(objKey => {
                        if (typeof LIST_OBJECTS !== 'undefined' && LIST_OBJECTS[objKey]) {
                            templateCache.innerHTML = LIST_OBJECTS[objKey].trim();
                            zoneDiv.appendChild(templateCache.content.cloneNode(true));
                        } else {
                            const err = document.createElement('div');
                            err.textContent = `[? ${objKey}]`;
                            err.style.cssText = "font-size:9px; color:red; padding:5px; border:1px dashed red;";
                            zoneDiv.appendChild(err);
                        }
                    });
                }
                fragment.appendChild(zoneDiv);
            });
            container.appendChild(fragment);
        }
    }
}


class MotionRenderer {
    render(manifest, state, root, layoutConfig) {

    }
}

class ContextRenderer {
    render(manifest, state, root, layoutConfig, tokenMap) {
        // Ambil data murni dari manifest (hasil olahan engine), BUKAN dari state mentah
        const overrides = manifest.overrides;
        const layoutOverrides = manifest.layoutOverrides;
        
        if (overrides && tokenMap) {
            Object.entries(overrides).forEach(([role, data]) => { 
                const domId = CONFIG_CONTEXT.ROLE_MAP[role];
                const el = document.getElementById(domId); 
                if (!el) return;

                // ✅ OVERRIDE CSS VARIABLE LOKAL (Tanpa !important)
                // Ini akan mengubah warna SATU komponen itu saja beserta anak-anaknya
                if (data.intentType === 'surface' && tokenMap.surfacePrimary) {
                    el.style.setProperty(tokenMap.surfacePrimary, data.rawValue);
                    el.style.setProperty(tokenMap.surfaceSecondary, data.rawValue);
                    

                } else if (data.intentType === 'accent' && tokenMap.accentPrimary) {
                    el.style.setProperty(tokenMap.accentPrimary, data.rawValue);
                }

                if (data.removeBgImage && tokenMap.surfaceFx) {
                    el.style.setProperty(tokenMap.surfaceFx, 'none');
                }
            });
        }
        
        if (layoutOverrides) {
            Object.entries(layoutOverrides).forEach(([domId, rules]) => {
                const el = document.getElementById(domId);
                if (!el) return;
                
                // ✅ Hapus 'display: none !important', ganti dengan property DOM standar
                if (rules.visible === false) {
                    el.style.display = 'none';
                } else {
                    el.style.display = ''; // Kembalikan kontrol ke stylesheet
                }
                
                if (rules.radius) {
                    const rMap = { 
                        sharp: '0px', 
                        sm: `var(${tokenMap.radiusSm})`, 
                        md: `var(${tokenMap.radiusMd})`, 
                        xl: `var(${tokenMap.radiusLg})`, 
                        pill: `var(${tokenMap.radiusFull})` 
                    };
                    // Set inline style, otomatis menang lawan class CSS eksternal
                    el.style.borderRadius = rMap[rules.radius] || rules.radius;
                }
            });
        }
    }
}



class IconRenderer {
    render(manifest, state, root, layoutConfig) {
        const iconData = manifest.iconography;
        if (!iconData || !iconData.resolved) return;
        const fallbackPack = iconData.currentPack || 'solar';
        document.querySelectorAll('[data-icon]').forEach(el => {
            const key = el.getAttribute('data-icon'); 
            const fullIconName = iconData.resolved[key] || `${fallbackPack}:${key}`;
            let iconEl = el.querySelector('iconify-icon');
            if (!iconEl) {
                el.innerHTML = `<iconify-icon icon="${fullIconName}"></iconify-icon>`;
            } else if (iconEl.getAttribute('icon') !== fullIconName) {
                iconEl.setAttribute('icon', fullIconName);
            }
        });
    }
}


class ResourceRenderer {
    constructor() { this.loadedResources = new Set(); }
    render(manifest, state, root, layoutConfig) {
        const context = manifest;
        const fontConfig = window.UniverseStudio.Core.getConfig().FONT;
        
        if (context.typography && context.typography.provider === 'google') {
            const fontName = context.typography.primaryFont;
            const formattedName = fontName.replace(/\s+/g, '+');
            const weights = context.typography.weights.join(';');
            const fontUrl = `${fontConfig.API_BASE}?family=${formattedName}:wght@${weights}&display=swap`;
            
            this._inject('font-loader', 'link', { rel: 'stylesheet', href: fontUrl }, fontName);
        }
        if (context.iconography && context.iconography.scriptUrl) {
            if (!window.customElements.get('iconify-icon')) {
                this._inject('icon-script', 'script', { src: context.iconography.scriptUrl, async: true }, 'iconify-core');
            }
        }
    }
    _inject(id, tag, attrs, signature) {
        if (signature && this.loadedResources.has(signature)) return;
        let el = document.getElementById(id);
        if (el && el.getAttribute(tag === 'link' ? 'href' : 'src') === (attrs.href || attrs.src)) return;
        if (el) el.remove();
        el = document.createElement(tag);
        el.id = id;
        Object.entries(attrs).forEach(([key, val]) => {
            if (val === true) el.setAttribute(key, '');
            else el.setAttribute(key, val);
        });
        document.head.appendChild(el);
        if (signature) this.loadedResources.add(signature);
    }
}


class DOMPainter {
    constructor() {
        this.renderers = [];
        this.tokenMap = {};
    }

    setTokenMap(map) {
        this.tokenMap = map;
        return this;
    }

    registerRenderer(name, renderer) {
        this.renderers.push({ name, renderer });
        return this;
    }

    paint(manifest, state) {
        const root = document.documentElement.style;
        const allLayoutConfigs = window.UniverseStudio.Core.getConfig().LAYOUT;
        const currentLayoutConfig = allLayoutConfigs[state.activePage] || [];

        this.renderers.forEach(({ renderer }) => {
            renderer.render(manifest, state, root, currentLayoutConfig, this.tokenMap);
        });
    }
}

<script id="ui-sdk-core">
(function (global) {
    'use strict';

    const InitialState = {
        environment: 'preview', 
        viewport: 'sm', 
        a11y: { reducedMotion: false },
        activeStyleId: 'neu_soft', 
        activeFamily: 'fam_neu', 
        activeDNA: 'wdna_standard',
        activeColorDNA: 'cdna_vibrant',
        activeWorldColor: 'wc_c',
        mode: 'worldColor', 
        themeTag: 'ELEVATED_DUAL', 
        themeParams: { depth: 'soft' },
        activeOptions: [], 
        shapeStrategy: 'md',
        currentColor: '#3b82f6',
