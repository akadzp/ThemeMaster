        currentOverrides: {}, 
        contextOverrides: {}, 
        layoutOverrides: {}
    };
    
    let _state = JSON.parse(JSON.stringify(InitialState));

    class UISDK {
        constructor() { this.pipeline = []; }
        register(name, instance, config) { this.pipeline.push({ name, instance, config }); return this; }
    }

    const sdk = new UISDK();

sdk.register('color', new ColorEngine(), { 
    worldColor: worldColor, 
    COLOR_DNA: COLOR_DNA,
    COLOR_DNA_PROFILES: (typeof COLOR_DNA_PROFILES !== 'undefined') ? COLOR_DNA_PROFILES : {},
    FAMILIES: CONFIG_THEME.FAMILIES,
    PALETTE: CONFIG_THEME.PALETTE,
    VARIANTS: CONFIG_THEME.VARIANTS,
    // ← ADD THIS: Pass worldTheme ke ColorEngine
    worldTheme: worldTheme
})
       .register('theme', new ThemeEngine(), { 
            worldTheme: worldTheme, 
            DNA: THEME_DNA,
            DNA_PROFILES: (typeof THEME_DNA_PROFILES !== 'undefined') ? THEME_DNA_PROFILES : {},
            THEME_DNA_PROFILES: (typeof THEME_DNA_PROFILES !== 'undefined') ? THEME_DNA_PROFILES : {},
            FAMILIES: CONFIG_THEME.FAMILIES,
            VARIANTS: CONFIG_THEME.VARIANTS,
            OPTIONS: CONFIG_THEME.OPTIONS
       })
       .register('motion', new MotionEngine(), CONFIG_MOTION)
       .register('font', new FontEngine(), { ...CONFIG_FONT, TYPOGRAPHY: CONFIG_THEME.TYPOGRAPHY })
              const dynamicLayouts = {};
if (window.UniverseStudio.Registry) {
    Object.keys(window.UniverseStudio.Registry).forEach(key => {
        dynamicLayouts[key] = window.UniverseStudio.Registry[key].config;
    });
}

sdk.register('layout', new LayoutEngine(), { LAYOUT: dynamicLayouts })

       .register('context', new ContextEngine(), CONFIG_CONTEXT)
       .register('icon', new IconEngine(), CONFIG_ICON)
       .register('sound', new SoundEngine(), {})
       .register('voice', new VoiceEngine(), {})
              .register('lang', new LanguageEngine(), {})
       .register('ai', new AiEngine(), {});

        const painter = new DOMPainter()
        .setTokenMap(CONFIG_TOKEN_MAP)
        .registerRenderer('resource', new ResourceRenderer())
        .registerRenderer('color', new ColorRenderer())
        .registerRenderer('theme', new ThemeRenderer())
        .registerRenderer('font', new FontRenderer())
        .registerRenderer('layout', new LayoutRenderer())
        .registerRenderer('context', new ContextRenderer())
        .registerRenderer('icon', new IconRenderer())
        .registerRenderer('motion', new MotionRenderer());


        async function _runEngine() {
        const engines = {};
        for (const item of sdk.pipeline) {
            engines[item.name] = item;
        }

        async function safeRun(engineDef, ...args) {
            if (!engineDef) return null;
            try {
                return await engineDef.instance.process(_state, engineDef.config, ...args);
            } catch (err) {
                console.error(`[UISDK] Isolator Actived: Engine '${engineDef.name}' failed`, err);
                return null;
            }
        }

        const results = {
    color: await safeRun(engines.color),
    theme: await safeRun(engines.theme),
    motion: await safeRun(engines.motion),
    font: await safeRun(engines.font),
    layout: await safeRun(engines.layout),
    icon: await safeRun(engines.icon),
    sound: await safeRun(engines.sound),
    voice: await safeRun(engines.voice),
    lang: await safeRun(engines.lang),
    ai: await safeRun(engines.ai)
};

// ✅ KEMBALIKAN DEKLARASI INI (karena dibutuhkan oleh manifest)
const palette = results.color ? results.color.palette : null;

// ✅ TAPI JANGAN DIOPER KE CONTEXT ENGINE! (Ini inti dari aturan Decoupled)
const contextRes = await safeRun(engines.context); 

const manifest = {
    tokens: {},
    vars: results.theme ? results.theme.vars : {},
    palette: palette, // <-- Di sini dia butuh variabel palette tadi
    layout: results.layout ? results.layout.layout : null,
    motion: results.motion ? results.motion.motion : null,
    overrides: contextRes ? contextRes.overrides : null,
    typography: results.font ? results.font.typography : null,
    iconography: results.icon ? results.icon.iconography : null,
    sound: results.sound ? results.sound.sound : null,
    voice: results.voice ? results.voice.voice : null,
    locale: results.lang ? results.lang.locale : null,
    ai: results.ai ? results.ai.ai : null
};

        const tokenSources = [
    { name: 'color', data: results.color },
    { name: 'theme', data: results.theme },
    { name: 'motion', data: results.motion }, 
    { name: 'font', data: results.font }
];

const tokenStats = {};
tokenSources.forEach(source => {
    if (source.data && source.data.tokens) {
        const sourceTokenCount = Object.keys(source.data.tokens).length;
        tokenStats[source.name] = sourceTokenCount;
        
        // Merge dengan verbose logging
        Object.entries(source.data.tokens).forEach(([key, value]) => {
            if (manifest.tokens[key]) {
                console.warn(
                    `[UISDK] Token override: ${key} (${source.name} overrides previous)`
                );
            }
            manifest.tokens[key] = value;
        });
    } else {
        tokenStats[source.name] = 0;
    }
});



        painter.paint(manifest, _state);
    }

    class ExportEngine { static getPayload() { return btoa(JSON.stringify(["V5.2_COMPLETE", _state])); } }

            const API = Object.freeze({
            getConfig: () => ({ 
        THEME: CONFIG_THEME, 
        LAYOUT: dynamicLayouts, 
        CONTEXT: CONFIG_CONTEXT, 
        ICON: CONFIG_ICON, 
        FONT: CONFIG_FONT, 
        worldColor: worldColor 
    }),
    
    getState: () => JSON.parse(JSON.stringify(_state)),
    setIconPack: (packId) => { _state.activeIconPack = packId; return _runEngine(); },
    setFont: (fontName) => { _state.activeFont = fontName; return _runEngine(); },
    
    setTheme: (variantId) => { 
    const variant = CONFIG_THEME.VARIANTS[variantId]; 
    if (!variant) return Promise.resolve(); 
    
    const parentFam = CONFIG_THEME.FAMILIES[variant.fam];
        _state.activeStyleId = variant.id; 
        _state.activeFamily = variant.fam; 
        
        const wcKey = variant.worldColor || parentFam.worldColor || 'wc_a';
        _state.activeWorldColor = wcKey;

        const wcConfig = worldColor[wcKey];
        if (wcConfig) {
            if (wcConfig.dark_policy === 'wajib-on') _state.isDark = true;
            else if (wcConfig.dark_policy === 'wajib-off') _state.isDark = false;

            if (wcConfig.bg_policy === 'wajib-on') _state.isBgFilled = true;
            else if (wcConfig.bg_policy === 'wajib-off') _state.isBgFilled = false;
        }

        if (variant.dna && typeof variant.dna === 'string') _state.activeDNA = variant.dna;
        else if (parentFam.dna) _state.activeDNA = parentFam.dna;
        else _state.activeDNA = 'wdna_standard';
        
        _state.activeOptions = []; 
        return _runEngine();
    },

    setOption: (optId, isActive) => { 
        if (isActive) { if (!_state.activeOptions.includes(optId)) _state.activeOptions.push(optId); } 
        else { _state.activeOptions = _state.activeOptions.filter(x => x !== optId); } 
        return _runEngine(); 
    },
    setDNA: (dnaId) => { if (THEME_DNA[dnaId] || THEME_DNA_PROFILES[dnaId]) { _state.activeDNA = dnaId; return _runEngine(); } return Promise.resolve(); },
    setLayout: (target, value) => { if (_state.layout) _state.layout[target] = value; return _runEngine(); },
    setShape: (shapeId) => { _state.shapeStrategy = shapeId; return _runEngine(); },
    setPage: (pageId) => { _state.activePage = pageId; return _runEngine(); },
    
    toggleDark: () => { 
        const wcConfig = worldColor[_state.activeWorldColor];
        if (wcConfig && wcConfig.dark_policy !== 'toggle') return Promise.resolve();
        _state.isDark = !_state.isDark; 
        return _runEngine(); 
    },
    
    toggleBg: () => { 
        const wcConfig = worldColor[_state.activeWorldColor];
        if (wcConfig && wcConfig.bg_policy !== 'toggle') return Promise.resolve();
        _state.isBgFilled = !_state.isBgFilled; 
        return _runEngine(); 
    },

    setContextOverride: (id, value) => { if (value === null) delete _state.contextOverrides[id]; else _state.contextOverrides[id] = value; return _runEngine(); },
    setColor: (hexColor) => { if (!hexColor || typeof hexColor !== 'string') return Promise.resolve(); _state.currentColor = hexColor; return _runEngine(); },
    setLayoutOverride: (domId, rule, val) => { if (!_state.layoutOverrides[domId]) _state.layoutOverrides[domId] = {}; _state.layoutOverrides[domId][rule] = val; return _runEngine(); },
    apply: () => _runEngine(),
    loadState: (savedState) => { if (savedState) _state = { ..._state, ...savedState }; return _runEngine(); },
    generateCode: () => ExportEngine.getPayload()
});




    global.UniverseStudio = global.UniverseStudio || {};
global.UniverseStudio.Core = API;

})(window);
</script>



<script id="app-main-logic">
const THEME_RULES = {
    'FLEXIBLE': { bgToggle: true, darkSupport: true },
    'STRICT_SURFACE': { bgToggle: false, darkSupport: true },
    'FIXED_LIGHT': { bgToggle: false, darkSupport: false, forceMode: 'light' },
    'FIXED_DARK': { bgToggle: false, darkSupport: false, forceMode: 'dark' }
};

class UIManager {
    constructor() {
        this.indices = { navSection: 0, navGroup: 0, themeCat: 0, themeFam: 0, assetMode: 'icons', activeCat: 'sans' };
        this.activeCtxId = null;
        this.iconCollections = null;
        this.CONFIGS = window.UniverseStudio ? window.UniverseStudio.Core.getConfig() : null;
        if (this.CONFIGS) this.init();
    }

    init() {
        this.loadState();
        this.renderNav();
                const hasColorCat = this.CONFIGS.THEME.CATEGORIES.find(c => c.id === 'ctx_color');
        if (!hasColorCat) this.CONFIGS.THEME.CATEGORIES.unshift({ id: 'ctx_color', label: 'WARNA KUSTOM' });

        const s = window.UniverseStudio.Core.getState();
        this.switchPage(s.activePage);
        this.sync();
        this.renderColors();
        this.renderCustomizers();
        
        if(document.getElementById('tab-assets').classList.contains('active')) {
            this.renderAssetsTab();
        }
    }

    saveState() {
        const s = window.UniverseStudio.Core.getState();
        localStorage.setItem('THEME_ENGINE_DATA', JSON.stringify({ meta: { v: '5.2' }, state: s }));
    }

    loadState() {
        const raw = localStorage.getItem('THEME_ENGINE_DATA');
        if (!raw) return;
        try { 
            const data = JSON.parse(raw);
            if (data.state) window.UniverseStudio.loadState(data.state); 
        } catch (e) { 
            localStorage.removeItem('THEME_ENGINE_DATA'); 
        }
    }
    
            generatePageScaffolding() {
        const container = document.getElementById('dynamic-pages-container');
        if (!container) return;
        
        while (container.firstChild) {
            container.removeChild(container.firstChild);
        }

        const registry = window.UniverseStudio.Registry;

        Object.keys(registry).forEach(pageId => {
            const pageData = registry[pageId];

            // 1. Buat Wrapper Halaman
            const pageDiv = document.createElement('div');
            pageDiv.id = `page-${pageId}`;
            // Penting: Halaman pertama ("home") kita jadikan aktif secara default agar terlihat.
            pageDiv.className = `view-section ${pageId === 'home' ? 'active' : ''}`;

            // 2. Buat Sticky Wrapper
            const stickyDiv = document.createElement('div');
            stickyDiv.className = 'preview-sticky';

            // 3. Buat DOM Target berdasarkan config
            if (pageData.config && Array.isArray(pageData.config) && pageData.config.length > 0) {
                pageData.config.forEach(section => {
                    if (section.target) {
                        const targetEl = document.createElement('div');
                        targetEl.id = section.target;
                        targetEl.className = 'ctx-override'; 
                        
                        // Tambahan: Beri class 'bdy-std' jika ini bukan header agar padding-nya normal
                        if (!section.target.toLowerCase().includes('header')) {
                            targetEl.classList.add('bdy-std');
                        }

                        stickyDiv.appendChild(targetEl);
                    }
                });
            } else {
                // Fallback jika halamannya terdaftar tapi belum ada config layout-nya
                const emptyState = document.createElement('div');
                emptyState.style.cssText = 'padding: 50px 20px; text-align: center; color: var(--c10-text-tertiary); font-size: 12px; font-weight: 700;';
                emptyState.innerHTML = `<i class="fas fa-tools" style="font-size:24px; margin-bottom:10px; display:block;"></i>[ Layout ${pageData.label} Belum Tersedia ]`;
                stickyDiv.appendChild(emptyState);
            }

            pageDiv.appendChild(stickyDiv);
            container.appendChild(pageDiv);
        });
    }


            renderNav() {
        const menu = document.getElementById('nav-menu');
        if (!menu) return;
        menu.innerHTML = '';
        
        if (!window.UniverseStudio.Registry) return;

        Object.keys(window.UniverseStudio.Registry).forEach(key => {
            const pageData = window.UniverseStudio.Registry[key];
            const el = document.createElement('div'); 
            el.className = 'nav-item'; 
            el.innerText = pageData.label.toUpperCase();
            el.onclick = () => { this.switchPage(key); menu.classList.remove('show'); };
            menu.appendChild(el);
        });
    }



    switchPage(id) {
        window.UniverseStudio.Core.setPage(id);
        const navTxt = document.getElementById('nav-text');
        if (navTxt) navTxt.innerText = id.toUpperCase().replace(/-/g, ' ');
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        const target = document.getElementById('page-' + id);
        if (target) target.classList.add('active');
        this.indices.navSection = 0; 
        this.indices.navGroup = 0;
        this.renderThemeHierarchy();
        this.renderHierarchy(); 
        const activeTab = document.querySelector('.tab-item.active');
        if(activeTab) {
            const tabName = activeTab.innerText.toLowerCase();
            UniverseStudio.UI.updateFloatingButtonContext(tabName === 'tema' ? 'theme' : tabName);
        }
    }

    renderThemeHierarchy() {
        const l2 = document.getElementById('thm-l2');
        const l3 = document.getElementById('thm-l3');
        const l4 = document.getElementById('thm-l4');
        if (!l2 || !l3 || !l4) return;
        
        l2.innerHTML = ''; l3.innerHTML = ''; l4.innerHTML = '';
        const THEME = this.CONFIGS.THEME;
        const s = window.UniverseStudio.Core.getState();

        THEME.CATEGORIES.forEach((cat, idx) => {
            const btn = document.createElement('div');
            btn.className = `l2-pill ${idx === this.indices.themeCat ? 'active' : ''}`;
            btn.innerText = cat.label;
            btn.onclick = () => { this.indices.themeCat = idx; this.indices.themeFam = 0; this.renderThemeHierarchy(); };
            l2.appendChild(btn);
        });

        const activeCat = THEME.CATEGORIES[this.indices.themeCat];
        if (!activeCat) return;

        if (activeCat.id === 'ctx_color') {
            this.renderMergedColorTab(l3, l4); 
            return; 
        }

        const families = Object.values(THEME.FAMILIES).filter(f => f.cat === activeCat.id);
families.forEach((fam, idx) => {
            const txt = document.createElement('div');
            txt.className = `l3-text ${idx === this.indices.themeFam ? 'active' : ''}`;
            txt.innerText = fam.label;
            txt.onclick = () => { this.indices.themeFam = idx; this.renderThemeHierarchy(); };
            l3.appendChild(txt);
        });

        const activeFam = families[this.indices.themeFam];
        if (!activeFam) return;
        
        Object.values(THEME.VARIANTS).filter(v => v.fam === activeFam.id).forEach(variant => {
            const card = document.createElement('div');
            const isSelected = s.activeStyleId === variant.id;
            const hasOpts = variant.customizers && variant.customizers.length > 0;
            const indicator = hasOpts ? '<div class="opt-indicator"></div>' : '';
            card.className = `l4-card ${isSelected ? 'active' : ''}`;
            card.innerHTML = `${indicator}<i class="${variant.icon}"></i><span>${variant.label}</span>`;
            card.onclick = () => { 
                window.UniverseStudio.Core.setTheme(variant.id);
                this.renderThemeHierarchy();
                this.renderCustomizers();
                this.sync();
                UniverseStudio.UI.updateFloatingButtonContext('theme');
            };
            l4.appendChild(card);
        });
    }

    renderMergedColorTab(containerL3, containerL4) {
        const s = window.UniverseStudio.Core.getState();
        const CONTEXT = this.CONFIGS.CONTEXT;
        const targets = CONTEXT.MENU_MAP[s.activePage] || [];
        const perms = CONTEXT.PERMISSIONS[s.activeFamily] || CONTEXT.PERMISSIONS['default'];
        const menuItems = targets.filter(t => (perms[t.id] !== false) && (!t.condition || t.condition(s.layout, s.activeFamily)));
        
        if (menuItems.length === 0) {
            containerL3.innerHTML = '<span class="l3-text" style="opacity:0.5;">Mode ini dikunci oleh tema</span>';
            return;
        }

        if (!this.activeCtxId || !menuItems.find(m => m.id === this.activeCtxId)) {
            this.activeCtxId = menuItems[0].id;
        }
        const activeItem = menuItems.find(m => m.id === this.activeCtxId);

        menuItems.forEach((item) => {
            const txt = document.createElement('div');
            txt.className = `l3-text ${item.id === this.activeCtxId ? 'active' : ''}`;
            txt.innerHTML = `<i class="${item.icon}"></i> ${item.label}`; 
            txt.onclick = () => { this.activeCtxId = item.id; this.renderThemeHierarchy(); };
            containerL3.appendChild(txt);
        });

        const curVal = (s.contextOverrides && s.contextOverrides[activeItem.id]) || '#000000';
        const hasOverride = s.contextOverrides && s.contextOverrides.hasOwnProperty(activeItem.id);

        const createCard = (isActive, label, visualHTML, onClick, isInput = false) => {
            const card = document.createElement('div');
            card.className = `l4-card ${isActive ? 'active' : ''}`;
            if (isInput) card.style.position = 'relative';
            card.innerHTML = `${visualHTML}<span>${label}</span>`;
            
            if (isInput) {
                const inp = card.querySelector('input');
                inp.oninput = (e) => { window.UniverseStudio.Core.setContextOverride(activeItem.id, e.target.value); };
                inp.onchange = () => { this.renderThemeHierarchy(); }; 
            } else if (onClick) {
                card.onclick = onClick;
            }
            containerL4.appendChild(card);
        };

        if (hasOverride) {
            createCard(false, 'Reset', '<i class="fas fa-undo" style="color:var(--c43-status-error-text)"></i>', () => { 
                window.UniverseStudio.Core.setContextOverride(activeItem.id, null); 
                this.renderThemeHierarchy(); 
            });
        }

        const customDot = `<input type="color" value="${curVal}" class="color-input-hidden"><div class="color-dot" style="background:conic-gradient(red,lime,blue,red); width:28px; height:28px; border-radius:50%; border:2px solid var(--c32-border-secondary);"></div>`;
        createCard(false, 'Custom', customDot, null, true);

        ['#3b82f6', '#10b981', '#ffffff', '#000000', '#f59e0b', '#ef4444'].forEach(c => {
            const isActive = hasOverride && curVal.toLowerCase() === c;
            createCard(isActive, 'Hex', `<div class="color-dot" style="background:${c}; width:28px; height:28px; border-radius:50%; border:2px solid var(--c32-border-secondary);"></div>`, () => {
                window.UniverseStudio.Core.setContextOverride(activeItem.id, c);
                this.renderThemeHierarchy();
            });
        });
    }

    renderCustomizers() {
        const container = document.getElementById('customizer-grid'); 
        if (!container) return; 
        container.innerHTML = '';
        const s = window.UniverseStudio.Core.getState();
        const THEME = this.CONFIGS.THEME;
// Langsung tembak kuncinya, instan! O(1)
const variant = THEME.VARIANTS[s.activeStyleId]; 
const whitelist = variant?.customizers || [];

        
        if (whitelist.length === 0) { 
            container.innerHTML = '<div style="opacity:0.5;font-size:10px;text-align:center;width:100%;padding:20px;">Tidak ada opsi tambahan untuk tema ini.</div>'; 
            return; 
        }
        
        whitelist.forEach(optId => {
            const optData = THEME.OPTIONS[optId];
            if (!optData) return;
            const isActive = s.activeOptions.includes(optId);
            const row = document.createElement('div');
            row.className = `opt-row ${isActive ? 'active' : ''}`;
            row.innerHTML = `<div class="opt-info"><i class="${optData.icon}"></i><span>${optData.label}</span></div><div class="toggle-switch"></div>`;
            row.onclick = () => { window.UniverseStudio.Core.setOption(optId, !isActive); this.renderCustomizers(); };
            container.appendChild(row);
        });
    }

    renderHierarchy() {
    const l2 = document.getElementById('lvl2-box'); 
    const l3 = document.getElementById('lvl3-box'); 
    const l4 = document.getElementById('lvl4-box');
    if (!l2 || !l3 || !l4) return;
    l2.innerHTML = ''; l3.innerHTML = ''; l4.innerHTML = '';
    
    const s = window.UniverseStudio.Core.getState();
    const sections = this.CONFIGS.LAYOUT[s.activePage] || [];
    if (sections.length === 0) { 
        l2.innerHTML = '<div style="padding:10px; font-size:10px; opacity:0.5;">Tidak ada opsi layout untuk halaman ini.</div>'; 
        return; 
    }
    
    sections.forEach((sec, idx) => {
        const btn = document.createElement('div');
        btn.className = `l2-pill ${idx === this.indices.navSection ? 'active' : ''}`; 
        btn.innerText = sec.label;
        btn.onclick = () => { this.indices.navSection = idx; this.indices.navGroup = 0; this.renderHierarchy(); };
        l2.appendChild(btn);
    });

    const activeSection = sections[this.indices.navSection];
    if (activeSection && activeSection.groups) {
        activeSection.groups.forEach((grp, idx) => {
            const txt = document.createElement('div');
            txt.className = `l3-text ${idx === this.indices.navGroup ? 'active' : ''}`; 
            txt.innerText = grp.label;
            txt.onclick = () => { this.indices.navGroup = idx; this.renderHierarchy(); };
            l3.appendChild(txt);
        });
        
        const activeGroup = activeSection.groups[this.indices.navGroup];
        if (activeGroup) {
            // PERBAIKAN: Gunakan .variant (sesuai CONFIG) dan tambahkan fallback []
            const options = activeGroup.type === 'shape' 
                ? (this.CONFIGS.LAYOUT.SHAPES || []) 
                : (activeGroup.variant || activeGroup.options || []);

                        options.forEach(opt => {
                const card = document.createElement('div');
                
                let isSelected = (activeGroup.type === 'shape') 
                    ? (s.shapeStrategy === opt.id) 
                    : (s.layout[activeSection.target] === opt.id);
                
                let visual = `<i class="${opt.icon}"></i>`;
                if (activeGroup.type === 'shape') {
                    const rVal = {sharp:'0px',sm:'8px',md:'16px',xl:'24px',pill:'25px',organic:'15px'}[opt.id] || '12px';
                    visual = `<div class="shape-preview" style="border-radius:${rVal}"></div>`;
                }
                
                card.className = `l4-card ${isSelected ? 'active' : ''}`;
                card.innerHTML = `${visual}<span>${opt.label}</span>`;
                
                card.onclick = () => { 
                    if (activeGroup.type === 'shape') {
                        window.UniverseStudio.Core.setShape(opt.id); 
                    } else {
                        window.UniverseStudio.Core.setLayout(activeSection.target, opt.id); 
                    }
                    this.renderHierarchy(); 
                    UniverseStudio.UI.updateFloatingButtonContext('layout');  
                };
                
                l4.appendChild(card);
            });
        }
    }
}


    async renderAssetsTab() {
        const l2 = document.getElementById('ast-l2'); const l3 = document.getElementById('ast-l3'); const l4 = document.getElementById('ast-l4');
        if (!l2 || !l3 || !l4) return;
        if (!this.indices.assetMode) this.indices.assetMode = 'icons';

        l2.innerHTML = '';
        ['icons', 'fonts'].forEach(mode => {
            const btn = document.createElement('div');
            btn.className = `l2-pill ${this.indices.assetMode === mode ? 'active' : ''}`;
            btn.innerText = mode.toUpperCase();
            btn.onclick = () => { this.indices.assetMode = mode; this.indices.activeCat = null; this.renderAssetsTab(); };
            l2.appendChild(btn);
        });

        l3.innerHTML = ''; l4.innerHTML = '';

        if (this.indices.assetMode === 'icons') {
            const VIP_PACKS = ['solar', 'ph', 'mdi', 'material-symbols', 'tabler', 'fa6-solid', 'ri', 'mingcute', 'lucide', 'heroicons', 'fluent', 'ion', 'uil'];
            if (!this.iconCollections) {
                l4.innerHTML = '<div style="padding:20px; text-align:center; opacity:0.5;">Mengambil data...</div>';
                try {
                    const resp = await fetch(this.CONFIGS.ICON.API_COLLECTIONS);
                    this.iconCollections = await resp.json();
                } catch (e) { 
                    l4.innerHTML = '<div style="color:var(--c43-status-error-text); padding:10px; font-size:10px;">Gagal memuat API Ikon. Pastikan online.</div>'; 
                    return; 
                }
            }

            l4.innerHTML = '';
            const collections = this.iconCollections;
            VIP_PACKS.forEach(prefix => {
                const info = collections[prefix];
                if (!info) return;
                const card = document.createElement('div');
                const isActive = window.UniverseStudio.Core.getState().activeIconPack === prefix;
                const sampleIcon = (info.samples && info.samples.length > 1) ? info.samples[1] : 'home';
                card.className = `l4-card ${isActive ? 'active' : ''}`;
                card.innerHTML = `<iconify-icon icon="${prefix}:${sampleIcon}" style="font-size:24px; margin-bottom:6px;"></iconify-icon><span style="font-weight:700;">${info.name}</span><span style="font-size:8px; opacity:0.6;">${info.total} Icons</span>`;
                card.onclick = () => { window.UniverseStudio.Core.setIconPack(prefix); this.renderAssetsTab(); };
                l4.appendChild(card);
            });
        } else {
            const categories = this.CONFIGS.FONT.COLLECTIONS;
            const catKeys = Object.keys(categories);
            if (!this.indices.activeCat) this.indices.activeCat = 'sans';
            
            catKeys.forEach(key => {
                const cat = categories[key];
                const btn = document.createElement('div');
                btn.className = `l3-text ${this.indices.activeCat === key ? 'active' : ''}`;
                btn.innerText = cat.label;
                btn.onclick = () => { this.indices.activeCat = key; this.renderAssetsTab(); };
                l3.appendChild(btn);
            });

            const activeCatKey = this.indices.activeCat;
            const fontList = categories[activeCatKey].fonts;
            const currentFont = window.UniverseStudio.Core.getState().activeFont || 'Plus Jakarta Sans';

            fontList.forEach(font => {
                const card = document.createElement('div');
                const isActive = currentFont === font.name;
                card.className = `l4-card ${isActive ? 'active' : ''}`;
                card.innerHTML = `<div style="font-family:'${font.name}', sans-serif; font-size:24px; margin-bottom:5px;">Aa</div><span>${font.label}</span>`;
                card.onclick = () => { window.UniverseStudio.Core.setFont(font.name); this.renderAssetsTab(); };
                l4.appendChild(card);
            });
        }
    }

    renderColors() {
        const pal = document.getElementById('colorPalette'); 
        if (!pal) return; 
        pal.innerHTML = '';
        const createPicker = () => {
            const d = document.createElement('div'); d.className = 'ft-color-item'; d.style.background = 'conic-gradient(red,yellow,lime,cyan,blue,magenta,red)';
            const i = document.createElement('input'); i.type = 'color'; i.style.cssText = 'opacity:0;position:absolute;top:0;left:0;width:100%;height:100%;cursor:pointer;';
            i.oninput = (e) => { window.UniverseStudio.Core.setColor(e.target.value); }; 
            d.appendChild(i); return d;
        };
        pal.appendChild(createPicker());
        ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'].forEach(c => {
            const d = document.createElement('div'); d.className = 'ft-color-item'; d.style.background = c;
            d.onclick = () => { window.UniverseStudio.Core.setColor(c); }; 
            pal.appendChild(d);
        });
    }

    renderLayoutCustomizer() {
        const container = document.getElementById('layout-opt-grid'); 
        if (!container) return; 
        container.innerHTML = '';
        const s = window.UniverseStudio.Core.getState();
        const targets = this.CONFIGS.CONTEXT.MENU_MAP[s.activePage] || [];
        if (targets.length === 0) { container.innerHTML = '<div style="opacity:0.5;font-size:10px;text-align:center;padding:20px;">Tidak ada opsi layout untuk halaman ini.</div>'; return; }
        
        targets.forEach(item => {
            const domId = this.CONFIGS.CONTEXT.ROLE_MAP[item.id]; if(!domId) return;
            const current = (s.layoutOverrides && s.layoutOverrides[domId]) || { visible: true };
            const card = document.createElement('div'); 
            card.className = 'opt-row'; card.style.flexDirection = 'column'; card.style.gap = '8px'; card.style.alignItems = 'stretch'; card.style.width = '140px'; 
            const head = document.createElement('div'); head.style.display='flex'; head.style.justifyContent='space-between'; head.style.alignItems='center';
            head.innerHTML = `<div class="opt-info"><i class="${item.icon}"></i><span>${item.label}</span></div>`;
            const toggle = document.createElement('div'); toggle.className = 'toggle-switch';
            const isVisible = current.visible !== false;
            if(isVisible) toggle.style.background = 'var(--c48-accent-primary)';
            toggle.innerHTML = `<div style="position:absolute;top:2px;left:${isVisible?'18px':'2px'};width:16px;height:16px;background:#fff;border-radius:50%;"></div>`;
            toggle.onclick = () => { window.UniverseStudio.Core.setLayoutOverride(domId, 'visible', !isVisible); this.renderLayoutCustomizer(); };
            head.appendChild(toggle); card.appendChild(head);
            
            if(isVisible) {
                 const row = document.createElement('div'); row.style.display='flex'; row.style.gap='4px'; row.style.marginTop='5px'; row.style.paddingTop='5px'; row.style.borderTop='1px solid var(--c34-divider)';
                 [{id:'default',l:'Def'},{id:'sharp',l:'Sqr'},{id:'md',l:'Rnd'},{id:'pill',l:'Pill'}].forEach(sh => {
                     const btn = document.createElement('button'); 
                     const isActive = (current.radius === sh.id) || (!current.radius && sh.id === 'default');
                     btn.innerText = sh.l; 
                     let btnStyle = `flex:1;padding:4px 0;font-size:8px;border-radius:4px;cursor:pointer;border:1px solid var(--c31-border-primary);background:var(--c3-surface-primary);color:var(--c9-text-secondary);`;
                     if (isActive) btnStyle = `flex:1;padding:4px 0;font-size:8px;border-radius:4px;cursor:pointer;border:1px solid var(--c48-accent-primary);background:var(--c48-accent-primary);color:var(--c18-action-primary-text);`;
                     btn.style.cssText = btnStyle;
                     btn.onclick = () => { window.UniverseStudio.Core.setLayoutOverride(domId, 'radius', (sh.id === 'default') ? null : sh.id); this.renderLayoutCustomizer(); };
                     row.appendChild(btn);
                 });
                 card.appendChild(row);
            }
            container.appendChild(card);
        });
    }

    sync() {
    const state = window.UniverseStudio.Core.getState();
    const wcConfig = this.CONFIGS.worldColor[state.activeWorldColor];
    
    if (wcConfig) {
        const btnDark = document.getElementById('btn-dark');
        if (btnDark) {
            const isLocked = wcConfig.dark_policy !== 'toggle';
            btnDark.disabled = isLocked;
            btnDark.style.opacity = isLocked ? '0.4' : '1';
            btnDark.style.cursor = isLocked ? 'not-allowed' : 'pointer';
            
            let icon = state.isDark ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
            if (isLocked) icon += '<i class="fas fa-lock" style="font-size:8px; position:absolute; top:4px; right:4px;"></i>';
            btnDark.innerHTML = icon;
        }

        const btnBg = document.getElementById('btn-bg');
        if (btnBg) {
            const isLocked = wcConfig.bg_policy !== 'toggle';
            btnBg.disabled = isLocked;
            btnBg.style.opacity = isLocked ? '0.4' : '1';
            btnBg.style.cursor = isLocked ? 'not-allowed' : 'pointer';

            let icon = state.isBgFilled ? '<i class="fas fa-fill-drip"></i>' : '<i class="fas fa-tint-slash"></i>';
            if (isLocked) icon += '<i class="fas fa-lock" style="font-size:8px; position:absolute; top:4px; right:4px;"></i>';
            btnBg.innerHTML = icon;
        }
    }
}

}

window.UniverseStudio = window.UniverseStudio || {};
window.UniverseStudio.UI = {
    toggleNav: () => { 
        const menu = document.getElementById('nav-menu'); 
        if(menu) menu.classList.toggle('show'); 
    },
    
    toggleDarkMode: () => { 
        // Panggil Core SDK, lalu sync UI manager
        UniverseStudio.Core.toggleDark().then(() => { 
            if(window.uiManager) window.uiManager.sync(); 
        }); 
    },
    
    toggleBgMode: () => { 
        UniverseStudio.Core.toggleBg().then(() => { 
            if(window.uiManager) window.uiManager.sync(); 
        }); 
    },
    
    switchCategory: (type, btn) => { 
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); 
        btn.classList.add('active'); 
        
        document.querySelectorAll('.cat-grid').forEach(c => c.classList.remove('active')); 
        const target = document.getElementById('cat-' + type); 
        if(target) target.classList.add('active'); 
    },
    
    updateFloatingButtonContext: (tabId) => {
        const btn = document.getElementById('btn-tune');
        if (!btn) return;
        
        const icons = { 'theme': 'fa-sliders-h', 'layout': 'fa-ruler-combined', 'motion': 'fa-tachometer-alt', 'assets': 'fa-icons' };
        btn.innerHTML = `<i class="fas ${icons[tabId] || 'fa-cog'}"></i>`;
        
        // Ambil state & config dari Core
        const s = UniverseStudio.Core.getState();
        const CONFIGS = UniverseStudio.Core.getConfig();
        let active = false;
        
        if(tabId === 'theme') { 
            const v = CONFIGS.THEME.VARIANTS[s.activeStyleId]; 
            if(v && v.customizers && v.customizers.length > 0) active = true; 
        }
        else if(tabId === 'layout') { 
            if(CONFIGS.CONTEXT.MENU_MAP[s.activePage]?.length) active = true; 
        }
        
        btn.disabled = !active; 
        btn.style.opacity = active ? '1' : '0.3'; 
        btn.style.color = active ? 'var(--c48-accent-primary)' : 'var(--c9-text-secondary)'; 
        btn.style.borderColor = active ? 'var(--c48-accent-primary)' : 'transparent';
    },
    
    handleOptionalClick: () => {
        const tab = document.querySelector('.tab-item.active'); 
        if (!tab) return;
        
        const id = tab.innerText.toLowerCase();
        if (id === 'tema') { 
            document.getElementById('view-theme-main').style.display = 'none'; 
            document.getElementById('view-theme-opt').style.display = 'flex'; 
            document.getElementById('view-theme-opt').style.flexDirection = 'column'; 
            if(window.uiManager) window.uiManager.renderCustomizers(); 
        }
        else if (id === 'layout') { 
            document.getElementById('view-layout-main').style.display = 'none'; 
            document.getElementById('view-layout-opt').style.display = 'flex'; 
            document.getElementById('view-layout-opt').style.flexDirection = 'column'; 
            if(window.uiManager) window.uiManager.renderLayoutCustomizer(); 
        }
    },
    
    closeOptionalView: () => { 
        document.querySelectorAll('.hierarchy-workspace').forEach(el => { 
            if (el.id.includes('-opt')) el.style.display = 'none'; 
            if (el.id.includes('-main')) el.style.display = 'flex'; 
        }); 
    },
    
    switchTab: (id, el) => {
        document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active')); 
        el.classList.add('active');
        
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); 
        document.getElementById('tab-' + id).classList.add('active');
        
        // Panggil fungsi sibling di dalam object UI
        UniverseStudio.UI.closeOptionalView();
        
        if (id === 'tema') { 
            if(window.uiManager) window.uiManager.activeCtxId = null; 
        } 
        if (id === 'assets') { 
            if(window.uiManager) window.uiManager.renderAssetsTab(); 
        }
        
        UniverseStudio.UI.updateFloatingButtonContext(id);
    },
    
    generate: function() {
        const btn = document.querySelector('.btn-save'); 
        let oriIcon = '';
        
        if(btn) { 
            oriIcon = btn.innerHTML; 
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; 
            btn.style.opacity = '0.7'; 
            btn.disabled = true; 
        }
        
        setTimeout(() => { 
            try { 
                const secretCode = UniverseStudio.Core.generateCode(); 
                if (navigator.clipboard) { 
                    navigator.clipboard.writeText(secretCode).then(() => { 
                        alert("✅ KODE TEMA DISALIN KE CLIPBOARD!"); 
                    }); 
                } else { 
                    prompt("Salin kode ini:", secretCode); 
                } 
            } catch (err) { 
                alert("Gagal Generate: " + err.message); 
            } finally { 
                if(btn) { 
                    btn.innerHTML = oriIcon; 
                    btn.style.opacity = '1'; 
                    btn.disabled = false; 
                } 
            } 
        }, 500);
    },
    
    applyAutoFit: function() {
        requestAnimationFrame(() => {
            document.querySelectorAll('[data-fit]').forEach(el => {
                el.style.whiteSpace = 'nowrap';
                el.style.overflow = 'hidden';
                el.style.display = 'block';
                el.style.width = '100%';
                el.style.fontSize = '';
                
                let size = parseInt(window.getComputedStyle(el).fontSize) || 14; 
                const parentWidth = el.parentElement.clientWidth;
                const minSize = 9;
                
                if (parentWidth > 0) {
                    while (el.scrollWidth > parentWidth && size > minSize) {
                        size--;
                        el.style.fontSize = `${size}px`;
                    }
                }
            });
        });
    },
    
    fixEditorGlitch: function() {
        const editorPanel = document.querySelector('.editor-panel');
        if (editorPanel) {
            editorPanel.style.display = 'none';
            editorPanel.offsetHeight; // trigger reflow
            editorPanel.style.display = 'flex';
        }
    }
};



document.addEventListener('DOMContentLoaded', () => { 
    if (window.UniverseStudio && window.UniverseStudio.Core) { 
        
        window.uiManager = new UIManager(); 

        // 1. BANGUN KERANGKA DOM DULU (Sebelum Core melukis UI)
        window.uiManager.generatePageScaffolding();
        
        // 2. BARU SURUH SDK MELUKIS
        window.UniverseStudio.Core.apply().then(() => {        
            window.UniverseStudio.UI.applyAutoFit();           
            window.UniverseStudio.UI.fixEditorGlitch();        
        }); 
        
        // 3. Observer untuk memantau perubahan
        const originalApply = window.UniverseStudio.Core.apply;
        window.UniverseStudio.Core.apply = async () => {
            await originalApply();
            window.UniverseStudio.UI.applyAutoFit();
            window.UniverseStudio.UI.fixEditorGlitch();
        };

    } else { 
        console.error("Critical: UISDK Core not loaded!"); 
    } 
});


</script>
